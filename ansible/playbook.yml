---
- name: GenePay — K3s single-node cluster setup
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update all packages
      apt:
        upgrade: dist
        update_cache: true

    - name: Install common utilities
      apt:
        name:
          - jq
          - curl
          - git
          - unzip
        state: present

    - name: Install AWS CLI v2
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        ./aws/install --update
        rm -rf aws awscliv2.zip
      args:
        chdir: /tmp
        creates: /usr/local/bin/aws

  roles:
    - role: docker
    - role: k3s
    - role: ingress
    - role: ecr
